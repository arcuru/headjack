# PAT_TOKEN-backed label removal re-triggers the Hold Gate; GITHUB_TOKEN
# events would leave its failing check unchanged. The reusable workflow gets
# the environment secret through environment: automation and secrets: inherit.
name: "Deps: Hold Expiry"

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  update-hold:
    if: github.repository_owner == 'arcuru'
    uses: arcuru/actions/.github/workflows/update-hold.yml@3cee03dd694bcbfe4a64ae899f4b9a7cbdfe357c # v0.5.0
    with:
      environment: automation
    secrets: inherit
